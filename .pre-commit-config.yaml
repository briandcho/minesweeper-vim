# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
default_install_hook_types: [pre-commit, pre-push, commit-msg]
repos:
-   repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
    -   id: bandit
        args: ["--exclude", "tests"]
-   repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
    -   id: detect-secrets
        name: detect-secrets scan for secrets
        require_serial: true
-   repo: https://github.com/bridgecrewio/checkov
    rev: 3.3.16
    hooks:
    -   id: checkov
        name: checkov IaC security scanner
        files: \.github/workflows/.*\.ya?ml$
        entry: checkov --framework github_actions
        require_serial: true
        stages: [pre-push]
-   repo: https://github.com/pypa/pip-audit
    rev: v2.10.1
    hooks:
    -   id: pip-audit
        name: pip-audit dependency vulnerability scanner
        args: ["-r", "requirements.txt"]
        stages: [pre-push]
-   repo: local
    hooks:
    -   id: tox-full
        name: full test suite (slow e2e tests + 100% coverage gate)
        # Deferred to pre-push (same reason as checkov/pip-audit above): the slow
        # e2e tests in tests/minesweeper_test.py each spawn the game as a real
        # subprocess, so `tox -e py` (what local iteration/tox -e pre-commit's
        # sibling env runs) stays fast. Still runs on `git push` and as CI's
        # test gate (see .github/workflows/ci.yml).
        entry: tox -e full
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files
    -   id: check-toml
    -   id: debug-statements
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
    -   id: ruff  # includes flake8 functionality
        args: [--fix, --exit-non-zero-on-fix]
    -   id: ruff-format
-   repo: https://github.com/tox-dev/pyproject-fmt
    rev: "v2.29.3"
    hooks:
    -   id: pyproject-fmt
-   repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
    -   id: mypy
-   repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
    -   id: pyupgrade
        args: [--py311-plus]

-   repo: https://github.com/commitizen-tools/commitizen
    rev: v4.18.0
    hooks:
    -   id: commitizen
        stages: [commit-msg]
