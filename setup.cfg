[metadata]
name = minesweeper_vim
version = 0.1.1
description = Curses minesweeper with vim-like bindings
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/briandcho/minesweeper-vim
author = Brian Cho
author_email = briandcho@yahoo.com
license = MIT
license_file = LICENSE
classifiers =
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: Implementation :: CPython
    Programming Language :: Python :: Implementation :: PyPy

[options]
packages = find:
install_requires =
    typer
python_requires = >=3.8

[options.packages.find]
exclude =
    tests*
    testing*

[options.entry_points]
console_scripts =
    minesweeper-vim = minesweeper_vim.ui:run

[coverage:run]
plugins = covdefaults

[flake8]
max-line-length = 100

[mypy]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true

[mypy-testing.*]
disallow_untyped_defs = false

[mypy-tests.*]
disallow_untyped_defs = false

[tox:tox]
envlist = py36,py37,py38,py39,py310,pre-commit
toxworkdir = {env:TOXWORKDIR:.tox}

[testenv]
deps =
    covdefaults
    hecate
    pytest-cov
    pytest-mock
    pytest-pythonpath
commands =
    coverage erase
    coverage run -m pytest {posargs:}
    coverage report {env:COVERAGE_OPTS:}

[testenv:pre-commit]
deps = pre-commit
skip_install = true
commands = pre-commit run --all-files --show-diff-on-failure
