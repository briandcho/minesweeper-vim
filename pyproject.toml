[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=77", "setuptools-scm>=8" ]

[project]
name = "minesweeper-vim"
description = "Curses-based minesweeper with (sort of) vim bindings"
readme = "README.md"
license = "MIT"
license-files = [ "LICENSE" ]
authors = [
  { name = "Brian Cho", email = "bdcho74@gmail.com" },
]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dynamic = [
  "version",
]
optional-dependencies.dev = [
  "covdefaults",
  "pexpect",
  "pyte",
  "pytest-cov",
  "pytest-mock",
]
urls.Homepage = "https://github.com/briandcho/minesweeper-vim"
scripts.minesweeper-vim = "minesweeper_vim.__main__:main"

[tool.setuptools]
packages.find.exclude = [ "tests", "tests.*" ]
package-dir = { "" = "." }

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"

[tool.ruff]
line-length = 100

[tool.mypy]
disallow_any_generics = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
overrides = [ { module = "tests.*", disallow_untyped_defs = false } ]

[tool.pytest]
ini_options.markers = [
  "slow: spawns the game as a real subprocess; deferred to `tox -e full` / pre-push / CI",
]

[tool.coverage]
# The e2e game tests spawn the app as a real subprocess (pexpect, for an
# authentic curses/tty session); parallel mode lets that subprocess write its
# own coverage data file (see tests/minesweeper_test.py's COVERAGE_RUN check)
# instead of clobbering the main process's, so `coverage combine` can merge
# them into one report that actually reflects the game loop's coverage.
run.parallel = true
run.plugins = [ "covdefaults" ]
# The subprocess is killed (not exited voluntarily) once a test is done with
# it; curses' own cleanup (endwin()) can hang under a pexpect-controlled pty
# with no real terminal responding to it, so relying on a normal Python
# exception/atexit unwind to save coverage data isn't reliable. sigterm=true
# makes coverage.py save its data directly from a SIGTERM handler instead
# (see tests/pty_runner.py's Runner.shutdown()).
run.sigterm = true

[tool.tox]
env_list = [ "pre-commit", "py" ]
env.full.description = "Run the full test suite (including slow e2e tests) with coverage"
env.pre-commit.description = "Run pre-commit hooks (excludes pre-push-only checks like pip-audit, checkov)"
env.pre-commit.skip_install = true
env.pre-commit.deps = [ "pre-commit" ]
# pip-audit and checkov (stages: [pre-push]) are deliberately excluded here to keep this fast
# for local dev use; they still run on `git push` (if the pre-push hook type is installed) and
# as standalone steps in CI's security job.
env.pre-commit.commands = [
  [
    "pre-commit",
    "run",
    "--all-files",
    "--show-diff-on-failure",
    { replace = "posargs", default = [], extend = true },
  ],
]
env.py.description = "Run the fast (non-e2e) tests only, no coverage - for local iteration"
# The "slow" e2e tests (stages: [pre-push], same as pip-audit/checkov above) are
# deliberately excluded here to keep local iteration fast; coverage is skipped too
# since its numbers would be meaningless without the e2e tests that own most of
# ui.py's coverage. They still run via `tox -e full`, on `git push` (if the
# pre-push hook type is installed), and as CI's test gate.
env.py.commands = [
  [ "pytest", "-m", "not slow" ],
]
env.update_deps.description = "Update requirements*.txt files and pre-commit hooks"
env.update_deps.skip_install = true
env.update_deps.deps = [ "pip-tools", "pre-commit" ]
env.update_deps.commands = [
  [ "pip-compile", "pyproject.toml", "--generate-hashes" ],
  [ "pip-compile", "pyproject.toml", "--extra", "dev", "--output-file=requirements-dev.txt" ],
  [ "pre-commit", "autoupdate" ],
]
env_run_base.description = "Run pytest with coverage"
# package = "editable" installs the project package (editable) into the env; without it,
# __version__'s importlib.metadata lookup in minesweeper_vim/__init__.py raises PackageNotFoundError.
env_run_base.package = "editable"
env_run_base.deps = [ "-r requirements-dev.txt" ]
env_run_base.pass_env = [ "PYTHONPATH" ]
env_run_base.set_env = { COVERAGE_RUN = "1" }
env_run_base.commands = [
  [ "coverage", "erase" ],
  [ "coverage", "run", "-m", "pytest" ],
  [ "coverage", "combine" ],
  [ "coverage", "report", "--show-missing" ],
]

[tool.commitizen]
name = "cz_conventional_commits"
